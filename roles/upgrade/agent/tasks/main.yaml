- name: Stop K3S Service
  systemd:
    name: k3s
    state: stopped

- name: Copy K3S Binary
  copy:
    src: /tmp/k3s-bin/k3s
    dest: /usr/local/bin/k3s
    mode: '0755'
    remote_src: yes

- name: Start K3s service
  systemd:
    name: k3s
    state: started
    enabled: yes


- name: Verify node is Ready
  shell: k3s kubectl get node {{ ansible_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: node_status
  until: node_status.stdout == "True"
  retries: 20
  delay: 10

