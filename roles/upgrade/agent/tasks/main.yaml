- name: Stop K3S Service
  systemd:
    name: k3s-node
    state: stopped

- name: Copy K3S Binary
  copy:
    src: /tmp/k3s-bin/k3s
    dest: /usr/local/bin/k3s
    mode: '0755'


- name: Start K3s service
  systemd:
    name: k3s-node
    state: started
    enabled: yes


