- name: Backup K3S Config and Data
  block:
    - name: Create backup directory
      file:
        path: /var/backup/k3s
        state: directory
        mode: '0755'

    - name: Backup K3S Config
      copy:
        src: /etc/rancher/k3s/
        dest: /var/backup/k3s/config-{{ ansible_date_time.date }}/
        remote_src: yes

    - name: Backup etcd snapshot (for server nodes)
      shell: k3s etcd-snapshot save --name backup-pre-upgrade-{{ ansible_date_time.date }}

- name: Stop K3S Service
  systemd:
    name: k3s
    state: stopped

- name: Copy K3S Binary
  copy:
    src: /tmp/k3s-bin/k3s
    dest: /usr/local/bin/k3s
    mode: '0755'

- name: Start K3s service
  systemd:
    name: k3s
    state: started
    enabled: yes


- name: Wait for K3s Master to be ready
  shell: k3s kubectl get nodes -l node-role.kubernetes.io/master
  register: kubectl_result
  until: kubectl_result.rc == 0
  retries: 30
  delay: 10


- name: Verify node is Ready
  shell: k3s kubectl get node {{ ansible_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: node_status
  until: node_status.stdout == "True"
  retries: 20
  delay: 10
