---
- name: Set hostname all Cluster Nodes
  hostname:
    name: "{{ inventory_hostname }}"

- name: Install nfs-common, pip3 to all Nodes
  apt:
    name: "{{ item }}"
    update_cache: true
  with_items:
    - nfs-common
    - python3-pip
  tags: apt-install

# - name: Install Kubernetes Module
#   pip:
#     name: kubernetes>=12.0.0
#     state: present

- name: Set same timezone on every Server
  community.general.timezone:
    name: "{{ system_timezone }}"
  when: (system_timezone is defined) and (system_timezone != "Your/Timezone")

- name: Set SELinux to disabled state
  ansible.posix.selinux:
    state: disabled
  when: ansible_os_family == "RedHat"

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true
  tags: sysctl

- name: Enable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    reload: true
  when: disable_ipv6 != "yes"
  tags: 
  - sysctl
  - ipv6

- name: Enable IPv6 router advertisements
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.accept_ra
    value: "2"
    state: present
    reload: true
  when: disable_ipv6 != "yes"
  tags: 
  - sysctl
  - ipv6

- name: Add br_netfilter to /etc/modules-load.d/
  copy:
    content: "br_netfilter"
    dest: /etc/modules-load.d/br_netfilter.conf
    mode: "u=rw,g=,o="
  when: ansible_os_family == "RedHat"

- name: Load br_netfilter
  community.general.modprobe:
    name: br_netfilter
    state: present
  when: ansible_os_family == "RedHat"

- name: Set bridge-nf-call-iptables (just to be sure)
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    state: present
    reload: true
  when: ansible_os_family == "RedHat"
  loop:
    - net.bridge.bridge-nf-call-iptables
    - net.bridge.bridge-nf-call-ip6tables
  tags: sysctl

- name: Add /usr/local/bin to sudo secure_path
  lineinfile:
    line: 'Defaults    secure_path = {{ secure_path[ansible_os_family] }}'
    regexp: "Defaults(\\s)*secure_path(\\s)*="
    state: present
    insertafter: EOF
    path: /etc/sudoers
    validate: 'visudo -cf %s'
  when: ansible_os_family in [ "RedHat", "Suse" ]

- name: Create directory K3S Rancher
  file:
    path: /etc/rancher/k3s
    state: directory
  when: privateDNS is defined

- name: Config DNS Private resolve
  template:
    src: resolv.conf.j2
    dest: /etc/rancher/k3s/resolv.conf
  when: privateDNS is defined

## Unlimit setting network
# fs.inotify.max_user_instances=8192
- name: Setting Max User Instance
  ansible.posix.sysctl:
    name: fs.inotify.max_user_instances
    value: '8192'
    state: present
    sysctl_set: true
    reload: true
  tags: unlimit


# fs.inotify.max_user_watches=524288
- name: Setting Max User Watches
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: '524288'
    state: present
    sysctl_set: true
    reload: true
  tags: unlimit

# Load module nf_conntrack
- name: Load nf_conntrack kernel module immediately
  ansible.builtin.command: modprobe nf_conntrack


# make sure module load after reboot
- name: Ensure nf_conntrack module is loaded on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/nf_conntrack.conf
    content: "nf_conntrack\n"
    owner: root
    group: root
    mode: '0644'


# net.netfilter.nf_conntrack_max = 524288
- name: Setting contrack_max
  ansible.posix.sysctl:
    name: net.netfilter.nf_conntrack_max
    value: '524288'
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.conf
  tags: unlimit

# net.netfilter.nf_conntrack_tcp_timeout_close_wait = 60
- name: Setting contrack close wait
  ansible.posix.sysctl:
    name: net.netfilter.nf_conntrack_tcp_timeout_close_wait
    value: '60'
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.conf
  tags: unlimit

# net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 60
- name: Setting contrack fin wait
  ansible.posix.sysctl:
    name: net.netfilter.nf_conntrack_tcp_timeout_fin_wait
    value: '60'
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.conf
  tags: unlimit

# net.netfilter.nf_conntrack_tcp_timeout_time_wait = 60
- name: Setting contrack time wait
  ansible.posix.sysctl:
    name: net.netfilter.nf_conntrack_tcp_timeout_time_wait
    value: '60'
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.conf
  tags: unlimit

# Setting unlimit security
# fs.file-max=65536
- name: Add or modify hard nofile limits for wildcard domain
  community.general.pam_limits:
    domain: '*'
    limit_type: hard
    limit_item: nofile
    value: 65536
  tags: pam_limit

- name: Add or modify soft nofile limits for wildcard domain
  community.general.pam_limits:
    domain: '*'
    limit_type: soft
    limit_item: nofile
    value: 65536
  tags: pam_limit


## caName: gamora - default (option gamora, nebula, nebulasit)
## Trust Internal CA
- name: Copy CRT file
  copy:
    src: "{{ item }}"
    dest: "/usr/local/share/ca-certificates/"
    owner: "root"
    group: "root"
    mode: 644
  loop: "{{ query('fileglob', 'internalCA/rootCA{{caName}}.crt') }}"
  tags: trustCA

- name: Update system trust
  raw: /usr/sbin/update-ca-certificates
  tags: trustCA


- name: Copy K3S Binary File
  copy:
    src: binaryK3Sfile/{{ k3s_version | default('v1.30.14+k3s2') }}/k3s
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: 0755