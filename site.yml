---
- name: Pre tasks
  hosts: all
  pre_tasks:
    - name: Verify Ansible is version 2.11 or above. (If this fails you may need to update Ansible)
      assert:
        that: "ansible_version.full is version_compare('2.11', '>=')"
        msg: >
          "Ansible is out of date. See here for more info: https://docs.technotim.live/posts/ansible-automation/"


- name: Prepare k3s nodes
  hosts: k3s_cluster
  gather_facts: true
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: prereq
      become: true
    - role: download
      become: true

- name: Setup k3s servers
  hosts: master
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: k3s_server
      become: true

- name: Setup k3s agents
  hosts: node
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: k3s_agent
      become: true

- name: Configure k3s cluster
  hosts: master
  environment: "{{ proxy_env | default({}) }}"
  roles:
    - role: k3s_server_post
      become: true

- name: Install Application for K3S Cluster
  hosts: master[0]
  run_once: true
  roles:
    - role: installArgoCD
      # link gen decrypt https://bcrypt-generator.com/
      # 1qaz@WSX
      vars: {argocd_admin_password: "$2a$12$uyQL27v9XcNj3BukQ9I8NunqMb/ECZNlvAJ3j9X7excqN2/s6FA1."}
      tags: installArgoCD
    - role: install-Ingress
      tags: install-Ingress
    - role: install-longhorn-storage
      tags: install-longhorn-storage
